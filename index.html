<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golxp Typeface | Interactive specimen by Siddhant Kapadne</title>
    <meta
      name="description"
      content="Golxp is a display typeface by Siddhant Kapadne. Explore the Gol font specimen: glyph grid, glyph wave, audio-reactive motion, and Golxp branding in a minimal interactive site."
    />
    <meta name="author" content="Siddhant Kapadne" />
    <meta
      name="keywords"
      content="Golxp, Golxp typeface, Gol font, Golxp font, Siddhant Kapadne, typeface specimen, display font, interactive typography"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f7f7f5" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="canonical" href="https://siddhantkapadne.github.io/GolxpTypeface/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Golxp Typeface" />
    <meta property="og:title" content="Golxp Typeface | Siddhant Kapadne" />
    <meta
      property="og:description"
      content="Interactive Golxp typeface specimen by designer Siddhant Kapadne — glyph grid, glyph wave, and Gol font showcase."
    />
    <meta property="og:url" content="https://siddhantkapadne.github.io/GolxpTypeface/" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Golxp Typeface | Siddhant Kapadne" />
    <meta
      name="twitter:description"
      content="Interactive Golxp typeface specimen — glyph grid, glyph wave, and Gol font by Siddhant Kapadne."
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Golxp Typeface",
        "url": "https://siddhantkapadne.github.io/GolxpTypeface/",
        "description": "Interactive typeface specimen for Golxp (Gol) by Siddhant Kapadne, with glyph grid, glyph wave, and music-reactive visuals.",
        "inLanguage": "en",
        "author": {
          "@type": "Person",
          "name": "Siddhant Kapadne",
          "url": "https://siddhant.website"
        },
        "isPartOf": {
          "@type": "WebSite",
          "name": "Golxp Typeface",
          "url": "https://siddhantkapadne.github.io/GolxpTypeface/"
        },
        "about": {
          "@type": "CreativeWork",
          "name": "Golxp",
          "alternateName": ["Golxp typeface", "Gol font", "Golxp font"],
          "description": "Golxp display typeface and interactive digital specimen.",
          "author": {
            "@type": "Person",
            "name": "Siddhant Kapadne",
            "url": "https://siddhant.website"
          },
          "creator": {
            "@type": "Person",
            "name": "Siddhant Kapadne",
            "url": "https://siddhant.website"
          }
        }
      }
    </script>
  </head>
  <body>
    <audio
      id="type-music"
      src="TypeMusic.mp3"
      loop
      preload="auto"
      playsinline
    ></audio>
    <div class="music-control" id="music-control">
      <button
        type="button"
        id="music-toggle"
        class="music-toggle"
        aria-pressed="false"
        aria-label="Play background music"
      >
        <svg class="music-icon music-icon-play" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M8 5v14l11-7z" />
        </svg>
        <svg class="music-icon music-icon-pause" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M6 5h4v14H6V5zm8 0h4v14h-4V5z" />
        </svg>
      </button>
    </div>
    <main class="page">
      <header class="hero">
        <div class="hero-marquee" aria-hidden="true">
          <div class="hero-marquee-inner">
            <span class="hero-marquee-seg"></span>
            <span class="hero-marquee-seg"></span>
          </div>
        </div>
        <div class="hero-content">
          <p class="label">Typeface</p>
          <h1 class="type-name" data-text="Gol">Gol<span class="type-name-sub">xp</span></h1>
          <p class="tagline">Golxp - by Siddhant Kapadne</p>
        </div>
      </header>

      <section class="block glyph-rows-block">
        <div
          id="glyph-rows"
          class="glyph-rows"
          aria-label="Uppercase alphabet, three rows"
        ></div>
      </section>

      <section class="block glyph-specimen-block">
        <h2 class="section-title">Glyph grid</h2>
        <div class="glyph-browser" id="glyph-browser">
          <div class="glyph-preview">
            <span
              class="glyph-preview-char"
              id="glyph-preview-char"
              aria-live="polite"
              aria-atomic="true"
            >A</span>
          </div>
          <div
            id="glyph-grid"
            class="glyph-grid"
            role="group"
            aria-label="Uppercase letters, select to preview"
          ></div>
        </div>
      </section>

      <section class="block interactive">
        <div class="interactive-head">
          <h2 class="section-title">Pattern</h2>
          <p class="hint">Hover tiles — glyph scales with the pointer.</p>
        </div>
        <div
          id="pattern"
          class="pattern"
          role="img"
          data-char="O"
          data-cols-wide="14"
          data-cols-narrow="8"
          data-rows-wide="10"
          data-rows-narrow="12"
          data-falloff="0.42"
          data-base-rem="1.1"
          data-max-rem="2.35"
          data-max-scale="1.65"
        ></div>
      </section>

      <section class="block wave-block" aria-label="Glyph wave animation">
        <div class="wave-head">
          <div class="wave-head-top">
            <h2 class="section-title">Glyph wave</h2>
            <button
              type="button"
              id="wave-track-btn"
              class="wave-track-btn"
              aria-label="Restart track from beginning"
            >
              <span class="wave-track-icon" aria-hidden="true">↻</span>
            </button>
          </div>
          <p class="wave-hint">
            O, K, R, E, L, A, X — twelve rows scroll and bounce with the background track.
          </p>
        </div>
        <div class="wave-stage" id="wave-stage">
          <canvas id="wave-canvas" aria-hidden="true"></canvas>
        </div>
      </section>

      <footer class="footer">
        <p class="footer-note">Gol.ttf</p>
        <p class="footer-credit">
          Created by Siddhant Kapadne.
          <a
            class="footer-link"
            href="https://siddhant.website"
            target="_blank"
            rel="noopener noreferrer"
            >Check out design portfolio — siddhant.website</a>
        </p>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
